[workspace]
resolver = "3"
# Every crate under crates/ is a member, so adding one never edits this file.
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

[workspace.dependencies]
# Pinned exactly: GPUI's API still changes between releases.
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
