[workspace]
resolver = "3"
# Every crate under crates/ is a member, so adding one never edits this file.
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

# Cargo.lock keeps libc at 0.2.189: gpui 0.2.2 pulls in xattr 0.2.3 (via zed-async-tar), which needs libc::ENOATTR on
# Linux, and libc 0.2.190 removed it. Don't `cargo update -p libc` past it until gpui moves on.

[workspace.dependencies]
# Pinned exactly: GPUI's API still changes between releases.
gpui = "=0.2.2"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
keyring = { version = "=3.6.3", default-features = false }
objc = "0.2"
raw-window-handle = "0.6"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
unicode-segmentation = "1.12"
# SSH tunnels (tg-core). Pure-Rust crypto: `ring` instead of russh's default aws-lc-rs, so no C/CMake/NASM build step.
russh = { version = "=0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
thiserror = "=2.0.21"
# Never called directly: depending on it with `sha1-insecure` makes cargo build russh's own pkcs5 with PBKDF2-HMAC-SHA1,
# which older `openssl`/`ssh-keygen -m PKCS8` use to encrypt keys (SSHJ reads those). Kept in sync with russh's pkcs5.
pkcs5 = { version = "=0.8.1", default-features = false, features = ["sha1-insecure"] }
tokio = { version = "=1.54.1", default-features = false }
# Database drivers (tg-driver). Pure-Rust TLS on `ring`, like russh, so no C toolchain beyond SQLite's own.
async-trait = "=0.1.92"
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "column_decltype"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "=0.8.5"
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "=0.14.0"
tokio-util = { version = "=0.7.20", default-features = false }
# DuckDB (tg-driver): the engine built in, at 1.5.6 like the Kotlin build's JDBC driver, so files stay compatible.
duckdb = { version = "=1.10506.1", features = ["bundled", "parquet", "json"] }
# ClickHouse over HTTP (tg-driver): rustls with the ring provider handed in, so no aws-lc build.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "query"] }
# SQL Server (tg-driver): TDS 7.4 over rustls (ring, from the workspace rustls), values through chrono.
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
# MySQL, MariaDB and TiDB (tg-driver). rustls with ring, as for PostgreSQL; `rustls-tls` also brings webpki-roots.
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# Redis, Valkey, KeyDB, Dragonfly (tg-driver): async with cluster and sentinel; TLS on rustls (ring, via use_ring).
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "cluster-async", "sentinel", "tokio-rustls-comp", "tls-rustls-insecure"] }
# Test-only (tg-core dev-dependencies).
rand = "=0.10.3"
