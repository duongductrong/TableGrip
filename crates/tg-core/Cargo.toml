[package]
name = "tg-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
# preserve_order: connection profiles this version doesn't understand are written back with their keys in the order
# they were read, as the Kotlin store does.
serde_json = { workspace = true, features = ["preserve_order"] }
tg-sql = { path = "../tg-sql" }

# java-keyring writes plain generic passwords through the system keychain; Linux's Secret Service is a separate
# decision (see secret.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
tempfile.workspace = true
