[versions]
kotlin = "2.3.20"
composeDesktop = "1.12.1"
jewel = "0.41.0-262.10968.63"
intellijPlatformBuild = "262.10968.63"
jbr = "1.12.0"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.11.0"
# JDBC drivers
postgresql = "42.7.8"
mysql = "9.4.0"
mariadb = "3.5.11"
sqlite = "3.50.3.0"
h2 = "2.3.232"
hsqldb = "2.7.4"
derby = "10.17.1.0"
mssql = "13.6.1.jre11"
clickhouse = "0.11.0"
duckdb = "1.5.6.0"
jaybird = "6.0.7"
trino = "484"
presto = "0.300"
oceanbase = "2.4.19"
ojdbc = "23.26.4.0.0"
lettuce = "7.9.0.RELEASE"
mongodb = "5.14.0"
hikari = "7.0.2"
javaKeyring = "1.0.4"
sshj = "0.41.2"
apacheSshd = "2.20.0"
junit = "5.13.4"
slf4j = "2.0.17"
logback = "1.5.18"

[libraries]
jewel-intUi-standalone = { module = "org.jetbrains.jewel:jewel-int-ui-standalone", version.ref = "jewel" }
jewel-intUi-decoratedWindow = { module = "org.jetbrains.jewel:jewel-int-ui-decorated-window", version.ref = "jewel" }
intellijPlatform-icons = { module = "com.jetbrains.intellij.platform:icons", version.ref = "intellijPlatformBuild" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbr" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

jdbc-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jdbc-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
jdbc-mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jdbc-sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
jdbc-h2 = { module = "com.h2database:h2", version.ref = "h2" }
jdbc-hsqldb = { module = "org.hsqldb:hsqldb", version.ref = "hsqldb" }
jdbc-derby = { module = "org.apache.derby:derby", version.ref = "derby" }
jdbc-mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
jdbc-clickhouse = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouse" }
jdbc-duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
jdbc-firebird = { module = "org.firebirdsql.jdbc:jaybird", version.ref = "jaybird" }
jdbc-trino = { module = "io.trino:trino-jdbc", version.ref = "trino" }
jdbc-oceanbase = { module = "com.oceanbase:oceanbase-client", version.ref = "oceanbase" }
jdbc-presto = { module = "com.facebook.presto:presto-jdbc", version.ref = "presto" }
# Oracle's own license (FUTC): tests only, never in the driver catalog.
jdbc-oracle = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
java-keyring = { module = "com.github.javakeyring:java-keyring", version.ref = "javaKeyring" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
apache-sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "apacheSshd" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeDesktop = { id = "org.jetbrains.compose", version.ref = "composeDesktop" }
