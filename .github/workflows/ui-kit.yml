# Checks the Rust UI kit (ui-kit/) against the conformance suite, and the Kotlin app against the same suite and golden
# files, on every push or PR that touches either. See docs/plans/rust-ui-kit.md.
name: UI kit

on:
  push:
    branches: [master]
    paths: ["ui-kit/**", "app/src/test/kotlin/dev/tablegrip/app/conformance/**", ".github/workflows/ui-kit.yml"]
  pull_request:
    paths: ["ui-kit/**", "app/src/test/kotlin/dev/tablegrip/app/conformance/**", ".github/workflows/ui-kit.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries GPUI links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libzstd-dev
      # rustup on the runner installs the toolchain and components rust-toolchain.toml names.
      - run: cargo fmt --all --check
        if: runner.os == 'macOS'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: runner.os == 'macOS'
      - run: cargo test --workspace --locked
      - name: Spike builds
        run: cargo build -p tg-spike --locked

  kotlin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :app:test --tests '*ConformanceTest*' --tests '*GoldenTest*'
