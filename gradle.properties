org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Jewel needs the JetBrains Runtime (JBR) to run. Compilation works with any JDK.
jdk.level=25

# The app's version (see app/build.gradle.kts). Release builds pass -Pdatagrok.build=<commit count of master>.
datagrok.version=1.0.0
datagrok.build=1
