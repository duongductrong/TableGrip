org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Jewel needs the JetBrains Runtime (JBR) to run. Compilation works with any JDK.
jdk.level=25

# The app's version (see app/build.gradle.kts). Release builds pass -Ptablegrip.build=<commit count of master>.
tablegrip.version=1.0.0-beta.7
tablegrip.build=1
# Ed25519 public key every update must be signed with: the base64 key Sparkle's generate_keys prints. The private key
# lives only in the release environment's SPARKLE_PRIVATE_KEY secret. Empty: the app's updater doesn't start.
tablegrip.sparklePublicKey=zbQFUXh2jb76YoBBEYPKja6VmGZcjWbacLafv6HmSEQ=
